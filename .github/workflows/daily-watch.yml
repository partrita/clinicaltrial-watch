name: Daily Clinical Trial Watch

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.66.0
          locked: false

      - name: Run Tests
        run: |
          pixi run test

      - name: Run Auto Discovery
        run: |
          pixi run python src/auto_discover_trials.py
        continue-on-error: true

      - name: Run Monitoring and Update
        run: |
          pixi run python src/main.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Stage all modified files including config and generated pages
          git add data/ trials.yaml _quarto.yml index.qmd targets/
          git diff --staged --quiet || (git commit -m "Update clinical trial data and configuration" && git push)
