name: Daily Clinical Trial Watch and Deploy

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Manual trigger
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.66.0
          locked: false

      - name: Run Tests
        run: |
          pixi run test

      - name: Run Auto Discovery
        run: |
          pixi run python src/auto_discover_trials.py
        continue-on-error: true

      - name: Run Monitoring and Update
        run: |
          pixi run python src/main.py

      - name: Render Quarto Website
        run: |
          pixi run render

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Stage all modified files including config and generated pages
          git add data/ trials.yaml _quarto.yml index.qmd targets/ trials/ _freeze/
          git diff --staged --quiet || (git commit -m "Update clinical trial data and generated pages" && git push)

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Deploy to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
