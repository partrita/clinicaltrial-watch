name: Daily Clinical Trial Watch and Deploy

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:      # Manual trigger
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.66.0
          locked: false

      - name: Run Tests
        run: |
          pixi run test

      - name: Run Auto Discovery
        run: |
          pixi run python src/auto_discover_trials.py
        continue-on-error: true

      - name: Run Monitoring and Update
        run: |
          pixi run python src/main.py

      - name: Render Quarto Website
        run: |
          pixi run render

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only state that persists across runs (snapshots, history) and
          # config. Derived output under data/targets/ is gitignored — it is
          # regenerated from the API on every run and would otherwise bloat
          # the repository history.
          git add data/snapshots data/history trials.yaml _quarto.yml index.qmd excluded_trials.yaml
          git diff --staged --quiet || (git commit -m "Update clinical trial data and generated pages" && git push)

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
